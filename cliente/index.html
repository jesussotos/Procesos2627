<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ficha.css">
  <link rel="stylesheet" href="css/buscador.css">
  <title>Oficios · Profesionales a domicilio en tu ciudad</title>
  <meta name="description" content="Encuentra fontaneros, electricistas, pintores y otros profesionales a domicilio en tu ciudad, con sus precios a la vista.">
</head>
<body>

  <header class="barra">
    <div class="contenedor">
      <a class="marca" href="/">Oficios</a>
      <div class="barra-sesion">
        <a class="btn-barra" id="acceso-barra" href="/acceso.html">Acceso profesionales</a>
      </div>
    </div>
  </header>

  <section class="banda buscador-banda">
    <div class="contenedor">
      <div>
        <h1 class="titulo">Encuentra un profesional de confianza cerca de ti.</h1>
        <p class="subtitulo">Fontaneros, electricistas, pintores y otros oficios que trabajan a domicilio en tu ciudad, con sus precios a la vista.</p>
      </div>
      <form id="form-busqueda" class="busqueda" role="search" novalidate>
        <div class="form-group buscador-ciudad">
          <label for="busqueda-ciudad">Ciudad</label>
          <input id="busqueda-ciudad" type="text" autocomplete="off" placeholder="¿Dónde lo necesitas?">
          <ul id="sugerencias" class="sugerencias" role="listbox" hidden></ul>
        </div>
        <div class="form-group">
          <label for="busqueda-sector">Oficio</label>
          <select id="busqueda-sector">
            <option value="">Todos los oficios</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>
    </div>
  </section>

  <main class="contenedor buscador-cuerpo">
    <div id="mensaje" class="alert" role="status"></div>

    <!-- Antes de buscar: los oficios del catálogo (RF-17) -->
    <section id="inicio" class="inicio">
      <h2>Busca por oficio</h2>
      <p class="ayuda">Elige un oficio y después tu ciudad.</p>
      <div id="atajos-sectores" class="atajos"></div>
    </section>

    <!-- Resultados (RF-18 a RF-20) -->
    <section id="resultados" hidden>
      <div class="resultados-cabecera">
        <h2 id="resumen" aria-live="polite"></h2>
        <div class="filtros">
          <div class="form-group">
            <label for="filtro-tipo">Tipo de precio</label>
            <select id="filtro-tipo">
              <option value="">Cualquiera</option>
              <option value="fijo">Precio fijo</option>
              <option value="hora">Por hora</option>
              <option value="unidad">Por unidad</option>
              <option value="desde">Desde</option>
              <option value="consultar">A consultar</option>
              <option value="presupuesto">Presupuesto cerrado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filtro-max">Importe máximo</label>
            <div class="con-sufijo">
              <input id="filtro-max" type="text" inputmode="decimal" placeholder="Sin límite">
              <span>€</span>
            </div>
          </div>
          <div class="form-group">
            <label for="filtro-orden">Ordenar por</label>
            <select id="filtro-orden">
              <option value="precio-asc">Más baratos primero</option>
              <option value="precio-desc">Más caros primero</option>
              <option value="recientes">Más recientes</option>
            </select>
          </div>
        </div>
      </div>
      <div id="lista-resultados" class="lista-resultados"></div>
      <nav id="paginacion" class="paginacion" aria-label="Páginas de resultados" hidden>
        <button type="button" class="btn btn-secondary" id="pagina-anterior">Anterior</button>
        <span id="pagina-actual"></span>
        <button type="button" class="btn btn-secondary" id="pagina-siguiente">Siguiente</button>
      </nav>
    </section>
  </main>

  <script src="precio.js"></script>
  <script src="publico.js"></script>
  <script src="buscador.js"></script>
</body>
</html>
