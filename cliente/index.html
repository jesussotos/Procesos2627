<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - SaaS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    
    <!-- Contenedor del Formulario (Login / Registro) -->
    <div id="auth-container">
      <div class="brand">
        <h2>Bienvenido</h2>
        <p>Inicia sesión o crea una cuenta para continuar</p>
      </div>

      <!-- Pestañas para alternar entre Login y Registro -->
      <div class="tabs">
        <button id="tab-login" class="tab-btn active" onclick="mostrarFormulario('login')">Iniciar Sesión</button>
        <button id="tab-registro" class="tab-btn" onclick="mostrarFormulario('registro')">Crear Cuenta</button>
      </div>

      <div id="mensaje" class="alert"></div>

      <!-- Formulario de Login -->
      <form id="form-login" class="form-panel active">
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" placeholder="usuario@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <!-- Formulario de Registro -->
      <form id="form-registro" class="form-panel">
        <div class="form-group">
          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="usuario@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary">Registrarse</button>
      </form>
    </div>

    <!-- Panel de Sesión Iniciada -->
    <div id="session-container" class="form-panel">
      <div class="brand">
        <h2>Panel de Usuario</h2>
        <p id="user-info">Sesión activa</p>
      </div>
      <button id="btn-logout" class="btn btn-secondary">Cerrar Sesión</button>
    </div>

  </main>

  <script src="rest.js"></script>
  <script>
    function mostrarFormulario(modo) {
      const formLogin = document.getElementById('form-login');
      const formRegistro = document.getElementById('form-registro');
      const tabLogin = document.getElementById('tab-login');
      const tabRegistro = document.getElementById('tab-registro');
      const mensaje = document.getElementById('mensaje');

      mensaje.style.display = 'none';
      mensaje.textContent = '';

      if (modo === 'login') {
        formLogin.classList.add('active');
        formRegistro.classList.remove('active');
        tabLogin.classList.add('active');
        tabRegistro.classList.remove('active');
      } else {
        formRegistro.classList.add('active');
        formLogin.classList.remove('active');
        tabRegistro.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }
  </script>
</body>
</html>
