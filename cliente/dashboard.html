<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta - SaaS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <div class="brand">
      <h2>Panel de Usuario</h2>
      <p id="user-info">Comprobando sesión...</p>
    </div>

    <div id="mensaje" class="alert"></div>

    <button id="btn-logout" class="btn btn-secondary">Cerrar Sesión</button>
    <button id="btn-eliminar" class="btn btn-secondary" style="margin-top: 12px; color: #dc2626; border-color: #fecaca;">Eliminar mi cuenta</button>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('jwt_token');
      const userInfo = document.getElementById('user-info');
      const mensajeDiv = document.getElementById('mensaje');

      function cerrarSesion() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('rol');
        window.location.href = '/index.html';
      }

      document.getElementById('btn-logout').addEventListener('click', cerrarSesion);

      // RF-09: el profesional elimina su propia cuenta (borrado lógico)
      document.getElementById('btn-eliminar').addEventListener('click', async () => {
        if (!confirm('¿Seguro que quieres eliminar tu cuenta? Podrás volver a registrarte con el mismo correo.')) return;
        try {
          const res = await fetch('/api/usuarios/me', {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'No se pudo eliminar la cuenta');
          localStorage.removeItem('jwt_token');
          localStorage.removeItem('rol');
          window.location.href = '/index.html?cuenta=eliminada';
        } catch (error) {
          mensajeDiv.style.display = 'block';
          mensajeDiv.textContent = error.message;
        }
      });

      // Sin token no hay sesión: vuelta al inicio
      if (!token) {
        window.location.href = '/index.html';
        return;
      }

      // El servidor decide si la sesión sigue siendo válida
      try {
        const res = await fetch('/api/usuarios/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
          const data = await res.json();
          userInfo.textContent = `Sesión iniciada como: ${data.usuario.email} (${data.usuario.rol})`;
        } else {
          // Token caducado o inválido
          cerrarSesion();
        }
      } catch (error) {
        mensajeDiv.style.display = 'block';
        mensajeDiv.textContent = 'Error al conectar con el servidor';
      }
    });
  </script>
</body>
</html>
