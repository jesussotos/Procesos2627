<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <h2>Panel de Usuario</h2>
      <p id="user-info">Cargando sesión...</p>
    </div>

    <div id="mensaje" class="alert"></div>
    <button id="btn-logout" class="btn btn-secondary">Cerrar Sesión</button>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('jwt_token');
      const mensaje = document.getElementById('mensaje');
      const userInfo = document.getElementById('user-info');

      if (!token) {
        window.location.href = '/index.html';
        return;
      }

      try {
        const respuesta = await fetch('/api/usuarios/me', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!respuesta.ok) {
          localStorage.removeItem('jwt_token');
          localStorage.removeItem('rol');
          window.location.href = '/index.html';
          return;
        }

        const datos = await respuesta.json();
        userInfo.textContent = `Sesión iniciada como: ${datos.usuario.email}`;
      } catch (error) {
        mensaje.style.display = 'block';
        mensaje.textContent = 'Error al conectar con el servidor';
      }

      document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('rol');
        window.location.href = '/index.html';
      });
    });
  </script>
</body>
</html>
